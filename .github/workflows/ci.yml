name: CI

# CI is driven by `main` only. `develop` is an integration branch — pushes to it
# deliberately do not burn CI minutes. A pull_request trigger keyed on `main`
# still runs for any PR *targeting* main, including develop -> main at release
# time, so nothing reaches main unverified.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClipySecure.xcodeproj -scheme ClipySecure

      - name: Build
        run: >
          xcodebuild build
          -project ClipySecure.xcodeproj
          -scheme ClipySecure
          -destination 'platform=macOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: >
          xcodebuild test
          -project ClipySecure.xcodeproj
          -scheme ClipySecure
          -destination 'platform=macOS'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
